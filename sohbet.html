        function firebaseBaslat() {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();

            // 1. ADIM: Sadece Firebase'deki gerçek durumu dinle
            db.collection('ayarlar').doc('sohbet_durumu').onSnapshot((doc) => {
                if (doc.exists) {
                    const veri = doc.data();
                    console.log("🔥 Güncel Sohbet Durumu:", veri.aktif);
                    durumuEkranaUygula(veri.aktif);
                } else {
                    durumuEkranaUygula(false);
                }
            });
        }

            sohbetAktif = aktif;
            const badge = document.getElementById('durumBadge');

            const acik = document.getElementById('aktifAlan');

            if (aktif === true) {
                badge.className = 'durum-badge acik';
                badge.innerHTML = '<i class="fas fa-circle"></i> CANLI';
                kapali.style.setProperty('display', 'none', 'important');
                acik.style.setProperty('display', 'flex', 'important');
                sohbetiBaslat();
            } else {
                badge.className = 'durum-badge kapali';
                badge.innerHTML = '<i class="fas fa-lock"></i> KAPALI';
                kapali.style.setProperty('display', 'flex', 'important');
                acik.style.setProperty('display', 'none', 'important');
                if (mesajDinleme) { mesajDinleme(); mesajDinleme = null; }
            }
        }

        // ============================================
        // ADMIN İŞLEMLERİ (Panel Görünümü)
        // ============================================
        function adminPaneliGoster() {
            const panel = document.getElementById('adminPanel');
            if (adminAcik) panel.classList.add('show');
            else panel.classList.remove('show');
        }

        document.getElementById('adminAcBtn').onclick = () => {
            if (!adminAcik) {
                const sifre = prompt("Admin Paneli Şifresi:");
                if (sifre === ADMIN_PASSWORD) {
                    adminAcik = true;
                    localStorage.setItem('vomAdminYetkisi', 'true');
                    adminPaneliGoster();
                } else if (sifre !== null) {
                    alert("❌ Şifre Yanlış!");
                }
            } else {
                adminAcik = false;
                localStorage.removeItem('vomAdminYetkisi');
                adminPaneliGoster();
            }
        };

        // ============================================
        // SOHBETİ AÇ/KAPAT BUTONLARI (Gerçek Kayıt)
        // ============================================
        document.getElementById('sohbetAcBtn').onclick = async () => {
            if (!adminAcik) {
                alert('Önce admin panelini açın!');
                return;
            }
            const sifre = prompt("Sohbeti başlatmak için şifre:");
            if (sifre === ADMIN_PASSWORD) {
                await db.collection('ayarlar').doc('sohbet_durumu').set({ aktif: true });
                alert("✅ Sohbet AÇILDI!");
            } else if (sifre !== null) {
                alert("❌ Şifre Yanlış!");
            }
        };

        document.getElementById('sohbetKapatBtn').onclick = async () => {
            if (!adminAcik) {
                alert('Önce admin panelini açın!');
                return;
            }
            const sifre = prompt("Sohbeti kapatmak için şifre:");
            if (sifre === ADMIN_PASSWORD) {
                await db.collection('ayarlar').doc('sohbet_durumu').set({ aktif: false });
                alert("✅ Sohbet KAPATILDI!");
            } else if (sifre !== null) {
                alert("❌ Şifre Yanlış!");
            }
        };

        // ============================================
        // MESAJ SEÇME / SİLME (Admin Paneli Açıkken)
        // ============================================
        let seciliMesajlar = new Set();

        function mesajTikla(e) {
            if (!adminAcik) return;
            const msg = e.currentTarget;
            const msgId = msg.dataset.msgId;
            if (!msgId) return;

            if (seciliMesajlar.has(msgId)) {
                seciliMesajlar.delete(msgId);
                msg.classList.remove('secilmis');
            } else {
                seciliMesajlar.add(msgId);
                msg.classList.add('secilmis');
            }
        }

        document.getElementById('secTumunuBtn').addEventListener('click', function() {
            if (!adminAcik) return;
            const mesajlar = document.querySelectorAll('.chat-message');
            mesajlar.forEach(msg => {
                const msgId = msg.dataset.msgId;
                if (msgId) {
                    seciliMesajlar.add(msgId);
                    msg.classList.add('secilmis');
                }
            });
        });

        document.getElementById('silSecilenBtn').addEventListener('click', function() {
            if (!adminAcik) return;
            if (seciliMesajlar.size === 0) {
                alert('Hiç mesaj seçilmedi!');
                return;
            }

            if (confirm(`${seciliMesajlar.size} mesaj silinecek. Emin misiniz?`)) {
                const batch = db.batch();
                let silinecek = 0;
                seciliMesajlar.forEach(msgId => {
                    const docRef = db.collection('sohbet').doc(msgId);
                    batch.delete(docRef);
                    silinecek++;
                });

                batch.commit().then(() => {
                    seciliMesajlar.clear();
                    alert(`✅ ${silinecek} mesaj silindi!`);
                }).catch((error) => {
                    console.error('Silme hatası:', error);
                    alert('❌ Silme başarısız!');
                });
            }
        });

        document.getElementById('temizleBtn').addEventListener('click', function() {
            if (!adminAcik) return;
            if (confirm('TÜM mesajlar silinecek. Emin misiniz?')) {
                db.collection('sohbet').get().then((snapshot) => {
                    const batch = db.batch();
                    snapshot.forEach((doc) => {
                        batch.delete(doc.ref);
                    });
                    return batch.commit();
                }).then(() => {
                    alert('✅ Tüm mesajlar silindi!');
                    seciliMesajlar.clear();
                }).catch((error) => {
                    console.error('Temizleme hatası:', error);
                    alert('❌ Temizleme başarısız!');
                });
            }
        });

        // ============================================
        // MESAJLAŞMA SİSTEMİ
        // ============================================
        function sohbetiBaslat() {
            if (mesajDinleme) return;
            const kullaniciAdi = document.getElementById('chatUsername');

            mesajDinleme = db.collection('sohbet').orderBy('zaman', 'asc').onSnapshot(snap => {
                const list = document.getElementById('chatMessages');
                const kullaniciSayisiSpan = document.getElementById('kullanici-sayisi');
                const kullanicilar = new Set();

                list.innerHTML = '';
                if (snap.empty) {
                    list.innerHTML = `
                        <div class="bos-mesaj">
                            <i class="fas fa-comment"></i>
                            <div>💬 Henüz mesaj yok.</div>
                            <div style="font-size:0.75rem; margin-top:4px; color:#b0c0d0;">İlk yorumu sen yap!</div>
                        </div>
                    `;
                    kullaniciSayisiSpan.innerText = '0';
                    return;
                }

                snap.forEach(doc => {
                    const data = doc.data();
                    if (data.kullanici) kullanicilar.add(data.kullanici);
                    const isBen = data.kullanici === kullaniciAdi.value && kullaniciAdi.value !== '';
                    const div = document.createElement('div');
                    div.className = `chat-message ${isBen ? 'sent' : 'received'}`;
                    div.dataset.msgId = doc.id;
                    div.innerHTML = `
                        <div class="username"><i class="fas fa-user-circle"></i> ${escapeHtml(data.kullanici || 'Anonim')}</div>
                        <div class="mesaj-metni">${escapeHtml(data.metin)}</div>
                        <div class="time">${data.zaman ? new Date(data.zaman.toDate()).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}) : ''}</div>
                    `;
                    list.appendChild(div);

                    if (adminAcik) {
                        div.style.cursor = 'pointer';
                        div.addEventListener('click', mesajTikla);
                    }
                });

                kullaniciSayisiSpan.innerText = kullanicilar.size;
                list.scrollTop = list.scrollHeight;
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        // ============================================
        // MESAJ GÖNDER
        // ============================================
        document.getElementById('chatSendBtn').onclick = async () => {
            const metin = document.getElementById('chatInput').value.trim();
            const ad = document.getElementById('chatUsername').value.trim() || 'Anonim';
            if (!metin) return;
            if (!sohbetAktif) {
                alert('Sohbet şu anda kapalı!');
                return;
            }
            if (document.getElementById('chatUsername').value.trim()) {
                localStorage.setItem('sohbet-kullanici', document.getElementById('chatUsername').value.trim());
            }
            try {
                await db.collection('sohbet').add({
                    kullanici: ad,
                    metin: metin,
                    zaman: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('chatInput').value = '';
                document.getElementById('chatInput').style.height = 'auto';
            } catch (error) {
                console.error('Mesaj gönderme hatası:', error);
                alert('⚠️ Mesaj gönderilemedi!');
            }
        };

        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chatSendBtn').click();
            }
        });

        // Textarea otomatik yükseklik
        document.getElementById('chatInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // ============================================
        // SAAT VE BAŞLATICI
        // ============================================
        setInterval(() => {
            const d = new Date();
            document.getElementById('saatGoster').innerText = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
        }, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('sohbet-kullanici');
            if (savedName) {
                document.getElementById('chatUsername').value = savedName;
            }
            adminPaneliGoster();
            firebaseBaslat();
        });
    </script>
</body>
</html>
