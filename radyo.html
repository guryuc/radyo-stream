@font-face{font-family:'DSEG7';src:url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2') format('woff2');font-display:swap}
:root{
  --blue:#2f8cff; --blue-soft:#7fa6cf; --blue-dim:#3d5a7d;
  --hl:#4da3ff; --clk:#8ec8ff; --soft:#8190a3; --lt:#a3afbf; --glow:rgba(110,180,255,.5);
  --red:#ff3b3b; --gray:#6a7584; --gray-dim:#454e5b;
  --accent:var(--gray); --txt:var(--gray);
  --dig:'SEVEN','DSEG7','Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(60% 40% at 15% 8%,rgba(47,140,255,.28),transparent 70%),
    radial-gradient(55% 40% at 90% 55%,rgba(90,60,200,.20),transparent 70%),
    radial-gradient(70% 50% at 30% 100%,rgba(20,110,190,.22),transparent 70%),
    #070b12;
  color:#dbe7f3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex;justify-content:center;align-items:flex-start;
  padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
}
body.cloud{--accent:var(--blue);--soft:#8db4de;--lt:#b4d4f7}
body.live{--accent:var(--red);--hl:#ff4545;--clk:#ff8f8f;--soft:#ff9b9b;--lt:#ffbcbc;--glow:rgba(255,70,70,.5)}
.wrap{width:100%;max-width:430px}

/* ---------- üst: marka + saat ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:4px 2px 18px}
.brand h1{margin:0;font-size:clamp(25px,8vw,34px);font-weight:800;letter-spacing:.06em;line-height:1;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 22px var(--glow)}
.brand h1 .v,.brand h1 .r{color:var(--hl)}
.brand p{margin:7px 0 0;font-size:10.5px;letter-spacing:.32em;color:var(--soft);white-space:nowrap}
.clock{display:flex;flex-direction:column;align-items:stretch;font-family:var(--dig);white-space:nowrap}
.clock .d{display:flex;justify-content:space-between;font-size:15px;color:var(--lt);margin-top:5px}
.clock .t{display:block;font-size:clamp(23px,7vw,30px);color:var(--clk);text-shadow:0 0 10px var(--glow);letter-spacing:0}

/* ---------- cam player ---------- */
.glass{
  position:relative;border-radius:30px;padding:20px 18px 18px;overflow:hidden;
  background:linear-gradient(155deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 38%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.09) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(255,255,255,.20);
  box-shadow:
    0 28px 50px -12px rgba(0,0,0,.75),
    0 8px 0 -2px rgba(255,255,255,.04),
    inset 0 1.5px 0 rgba(255,255,255,.45),
    inset 0 -2px 6px rgba(0,0,0,.35),
    inset 0 0 40px rgba(120,170,255,.06);
}
.glass::before{content:"";position:absolute;inset:0 0 55% 0;border-radius:30px 30px 60% 60%/30px 30px 24px 24px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));pointer-events:none}
.glass>*{position:relative}

.row1{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.14em;color:var(--lt);white-space:nowrap;gap:8px}
.row1 .rt{font-family:var(--dig);font-weight:400;letter-spacing:.08em;font-size:15px}

.banner{display:none;align-items:center;justify-content:center;gap:10px;margin:12px 0 0;font-weight:800;font-size:11px;letter-spacing:.1em;white-space:nowrap;color:var(--red);text-shadow:0 0 12px rgba(255,59,59,.7)}
body.live .banner{display:flex}
.banner .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red),0 0 22px var(--red);animation:blink 1s steps(2,start) infinite}
.banner .oa{border:1.5px solid var(--red);border-radius:6px;padding:2px 6px 2px 8px;letter-spacing:.18em;white-space:nowrap;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}

.mq{overflow:hidden;white-space:nowrap;height:40px;line-height:40px;margin:12px -4px 4px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.tk{display:inline-flex;white-space:nowrap;will-change:transform;animation:mq var(--d,12s) linear infinite}
.tk span{display:inline-block;padding-right:56px;font-family:var(--dig);font-size:24px;letter-spacing:.06em;color:var(--soft);text-shadow:0 0 12px var(--glow)}
body.off .tk span{color:#7b8796;text-shadow:none}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(calc(-1px * var(--w,300)))}}

.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin:8px 0 10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.7));box-shadow:0 0 8px var(--accent)}
.row3{display:flex;justify-content:space-between;align-items:center;font-family:var(--dig);font-size:15px;white-space:nowrap}
.row3 .tm{color:var(--lt);text-shadow:0 0 8px var(--glow)}
body.off .row3 .tm{text-shadow:none}
.row3 .md{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:9px;font-weight:600;letter-spacing:.12em;color:var(--accent);opacity:.5}
body.live .row3 .md{opacity:.75}

.spec{display:block;width:100%;height:58px;margin:16px 0 4px}

.ctl{display:flex;justify-content:center;margin:12px 0 4px}
#btn{
  width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.35);cursor:pointer;color:#fff;padding:0;
  background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.55),rgba(255,255,255,.10) 45%,rgba(255,255,255,.04) 70%),linear-gradient(160deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));
  box-shadow:0 14px 26px -6px rgba(0,0,0,.7),0 0 26px -4px var(--accent),inset 0 2px 1px rgba(255,255,255,.7),inset 0 -6px 10px rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s;
}
body.off #btn{background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.35),rgba(255,255,255,.06) 50%),linear-gradient(160deg,#6d7888,#3e4755);box-shadow:0 14px 26px -6px rgba(0,0,0,.7),inset 0 2px 1px rgba(255,255,255,.4),inset 0 -6px 10px rgba(0,0,0,.3)}
#btn:active{transform:translateY(3px) scale(.97)}
#btn svg{width:30px;height:30px;fill:#fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#btn .ps{display:none}
#btn.on .pl{display:none}#btn.on .ps{display:block}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--lt);opacity:.85;min-height:20px}
.mw{display:flex;align-items:center;min-width:0}
.pd{display:none;flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent),0 0 16px var(--accent);margin-right:9px;animation:blink 1.3s ease-in-out infinite}
.pd.on{display:inline-block}
#msg{letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.lc{display:flex;align-items:center;gap:5px;font-family:var(--dig);font-size:14px;color:var(--lt);white-space:nowrap}
.lc svg{width:13px;height:13px;fill:none;stroke:var(--lt);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp{text-align:center;font-family:var(--dig);font-size:14px;letter-spacing:.2em;color:rgba(195,210,230,.75);margin:22px 0 8px;white-space:nowrap}
@media (max-width:360px){.clock .t{font-size:21px}.brand p{letter-spacing:.2em}}
</style></head>

    <span class="lc" title="Dinleyici"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><b id="cnt" style="font-weight:400">-</b></span>
  </div>
</div>

<div class="cp">COPYRIGHT VOM RADYO</div>

</div>
<audio id="au" playsinline></audio>

<script>
var HOST = 'radyo-yayin.guryuc.workers.dev';
var API = 'https://' + HOST;
var WSURL = 'wss://' + HOST + '/ws';

var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
var ws = null, pc = null, cur = '', want = false;
var live = { isLive: false, mode: 'cloud', sessionId: null, trackName: null };
var np = { title: '', duration: 0, start: 0 };
var retry = 0, rtimer = null, ptimer = null;
function $(id) { return document.getElementById(id); }
var au = $('au');
function setMsg(t) { $('msg').textContent = t; }
function pad2(n) { n = Math.floor(n); return (n < 10 ? '0' : '') + n; }
function fmtT(s) { s = Math.max(0, Math.floor(s)); return pad2(s / 60) + ':' + pad2(s % 60); }

/* Dijital ekran: yazı tipinde olmayan Türkçe harfleri sadeleştir */
function dig(t) {
  var m = { 'ğ':'g','Ğ':'G','ş':'s','Ş':'S','ı':'i','İ':'I','ö':'o','Ö':'O','ü':'u','Ü':'U','ç':'c','Ç':'C' };
  return String(t).replace(/[ğĞşŞıİöÖüÜçÇ]/g, function (c) { return m[c]; }).replace(/[’'`´]/g, ' ').replace(/[–—]/g, '-').toUpperCase();
}

/* Saat + kısa tarih (Türkiye saati) */
var tf = null;
try { tf = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Istanbul', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }); } catch (e) {}
var MONTHS = ['OCAK','SUBAT','MART','NISAN','MAYIS','HAZIRAN','TEMMUZ','AGUSTOS','EYLUL','EKIM','KASIM','ARALIK'];
function tickClock() {
  var d = new Date();
  var o = { day: d.getDate(), month: d.getMonth() + 1, year: d.getFullYear(), hour: d.getHours(), minute: d.getMinutes(), second: d.getSeconds() };
  if (tf) {
    try {
      var p = tf.formatToParts(d);
      for (var i = 0; i < p.length; i++) if (o.hasOwnProperty(p[i].type)) o[p[i].type] = parseInt(p[i].value, 10);
    } catch (e) {}
  }
  $('clk').textContent = pad2(o.hour % 24) + ':' + pad2(o.minute) + ':' + pad2(o.second);
  $('dt').innerHTML = '<span>' + o.day + '</span><span>' + MONTHS[o.month - 1] + '</span><span>' + o.year + '</span>';
}

var mqText = 'YAYIN KAPALI';
function layoutMq() {
  var mq = $('mq'), tk = $('tk');
  tk.textContent = '';
  var s = document.createElement('span'); s.textContent = mqText; tk.appendChild(s);
  var unit = s.offsetWidth || 200, c = mq.clientWidth || 300;
  var n = Math.ceil(c / unit) + 1;
  for (var i = 1; i < n; i++) { var x = document.createElement('span'); x.textContent = mqText; tk.appendChild(x); }
  tk.style.setProperty('--w', unit);
  tk.style.setProperty('--d', (unit / 45).toFixed(1) + 's');
}
function setMq(text) {
  text = dig(text);
  if (text === mqText) return;
  mqText = text;
  layoutMq();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutMq);
window.addEventListener('resize', layoutMq);

function setNow(title, duration, elapsed) {
  np.title = title || '';
  np.duration = Number(duration) || 0;
  np.start = Date.now() - (Number(elapsed) || 0) * 1000;
  if (np.title) setMq(np.title);
  else setMq(live.isLive ? 'VOM RADYO' : 'YAYIN KAPALI');
  tickProgress();
}
function tickProgress() {
  if (np.title && np.duration > 0) {
    var el = Math.min(np.duration, Math.max(0, (Date.now() - np.start) / 1000));
    $('el').textContent = fmtT(el);
    $('tt').textContent = fmtT(np.duration);
    $('bar').style.width = (el / np.duration * 100).toFixed(1) + '%';
  } else {
    $('el').textContent = '00:00';
    $('tt').textContent = '00:00';
    $('bar').style.width = '0';
  }
}

function render() {
  var mode = live.isLive ? (live.mode === 'live' ? 'live' : 'cloud') : 'off';
  document.body.className = mode;
  $('md').textContent = mode === 'live' ? 'CANLI YAYIN MODU' : (mode === 'cloud' ? 'BULUT YAYIN MODU' : 'YAYIN KAPALI');
  $('btn').className = want ? 'on' : '';
  if (!np.title) setMq(live.isLive ? 'VOM RADYO' : 'YAYIN KAPALI');
}

/* ---------- ses ---------- */
async function api(method, path, body) {
  var r = await fetch(API + path, { method: method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}
function stopAudio() {
  clearTimeout(ptimer);
  if (pc) { try { pc.close(); } catch (e) {} }
  pc = null; au.srcObject = null; cur = '';
  detachAnalyser();
  $('pd').className = 'pd';
}
function failListen(mine, text) {
  if (pc !== mine) return;
  setMsg(text);
  clearTimeout(ptimer);
  ptimer = setTimeout(function () { if (want) { stopAudio(); syncAudio(); } }, 5000);
}
async function listen(pubSession, trackName) {
  var key = pubSession + '/' + trackName;
  if (key === cur && pc) return;
  stopAudio(); cur = key;
  setMsg('Bağlanıyor...');
  var mine = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }], bundlePolicy: 'max-bundle' });
  pc = mine;
  try {
    mine.ontrack = function (e) {
      var ms = new MediaStream([e.track]);
      au.srcObject = ms;
      au.play().catch(function () { setMsg('Sese başlamak için ekrana dokunun'); });
      attachAnalyser(ms);
    };
    mine.onconnectionstatechange = function () {
      if (pc !== mine) return;
      var s = mine.connectionState;
      if (s === 'connected') { setMsg('Canlı dinliyorsunuz'); $('pd').className = 'pd on'; }
      else if (s === 'connecting') setMsg('Bağlanıyor...');
      else if (s === 'disconnected' || s === 'failed' || s === 'closed') {
        setMsg('Bağlantı koptu, yeniden bağlanıyor...');
        clearTimeout(ptimer);
        ptimer = setTimeout(function () {
          if (pc === mine && mine.connectionState !== 'connected' && want) { stopAudio(); syncAudio(); }
        }, s === 'disconnected' ? 4000 : 1500);
      }
    };
    var s = await api('POST', '/calls/session/new');
    if (pc !== mine) return;
    if (!s.sessionId) { failListen(mine, 'Oturum açılamadı, tekrar deneniyor...'); return; }
    var r = await api('POST', '/calls/tracks/new', { sessionId: s.sessionId, tracks: [{ location: 'remote', sessionId: pubSession, trackName: trackName }] });
    if (pc !== mine) return;
    var tr = r.tracks && r.tracks[0];
    if (r.errorCode || (tr && tr.errorCode) || !r.sessionDescription) {
      failListen(mine, 'Abonelik başlamadı, tekrar deneniyor...');
      return;
    }
    await mine.setRemoteDescription(r.sessionDescription);
    var ans = await mine.createAnswer();
    await mine.setLocalDescription(ans);
    var rn = await api('PUT', '/calls/renegotiate', { sessionId: s.sessionId, sessionDescription: { type: 'answer', sdp: ans.sdp } });
    if (rn.errorCode) failListen(mine, 'Bağlantı hatası, tekrar deneniyor...');
  } catch (e) { failListen(mine, 'Hata, tekrar deneniyor...'); }
}
function syncAudio() {
  if (!want) return;
  if (live.isLive) listen(live.sessionId, live.trackName);
  else { stopAudio(); setMsg('Şu an yayın yok'); }
}

/* ---------- nokta matrisi VU ---------- */
var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var AC = null, analyser = null, asrc = null, fdata = null, realSince = 0, realSeen = false;
var cv = $('spec'), cx = cv.getContext('2d');
var NB = 26, NR = 7, lv = new Array(NB).fill(0), pk = new Array(NB).fill(0);
function attachAnalyser(ms) {
  if (IOS) return;                       // iPhone/iPad: Safari uzak sesi analiz ettirmez, animasyon kullanılır
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    if (!AC) AC = new C();
    if (AC.state === 'suspended') AC.resume();
    detachAnalyser();
    analyser = AC.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.78;
    asrc = AC.createMediaStreamSource(ms);
    asrc.connect(analyser);
    fdata = new Uint8Array(analyser.frequencyBinCount);
    realSince = Date.now(); realSeen = false;
  } catch (e) { analyser = null; }
}
function detachAnalyser() {
  try { if (asrc) asrc.disconnect(); } catch (e) {}
  asrc = null; analyser = null;
}
function sizeCanvas() {
  var r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.max(10, Math.round(r.width * dpr));
  cv.height = Math.max(10, Math.round(r.height * dpr));
}
function accentColor() {
  var m = document.body.className;
  return m === 'live' ? [255, 59, 59] : (m === 'cloud' ? [47, 140, 255] : [106, 117, 132]);
}
function playingNow() {
  return want && pc && pc.connectionState === 'connected' && !au.paused;
}
function fakeLevel(i, t) {
  var x = i / NB;
  var beat = 0.55 + 0.45 * Math.sin(t * 4.1 + Math.sin(t * 0.7) * 2);
  var v = 0.42 + 0.30 * Math.sin(t * 1.9 + i * 0.62) + 0.22 * Math.sin(t * 3.3 + i * 1.37) + 0.16 * Math.sin(t * 6.1 + i * 2.1);
  v *= (1 - x * 0.45) * (0.6 + 0.5 * beat);
  return Math.max(0.06, Math.min(1, v));
}
function drawSpec() {
  requestAnimationFrame(drawSpec);
  var W = cv.width, H = cv.height;
  if (!W) return;
  cx.clearRect(0, 0, W, H);
  var on = playingNow(), t = Date.now() / 1000, real = false;
  if (on && analyser) {
    analyser.getByteFrequencyData(fdata);
    var sum = 0; for (var q = 0; q < 64; q++) sum += fdata[q];
    if (sum > 0) { realSeen = true; real = true; }
    else real = realSeen || (Date.now() - realSince < 2500 ? false : false);
  }
  var col = accentColor();
  var cw = W / NB, ch = H / NR, r = Math.min(cw, ch) * 0.28;
  for (var i = 0; i < NB; i++) {
    var s = 0;
    if (!on) s = 0;
    else if (real) {
      var a = Math.floor(Math.pow(i / NB, 1.7) * 150) + 1, b = Math.max(a + 1, Math.floor(Math.pow((i + 1) / NB, 1.7) * 150) + 1);
      for (var k = a; k < b; k++) s = Math.max(s, fdata[k]);
      s = Math.pow(s / 255, 1.2);
    } else s = fakeLevel(i, t);
    lv[i] += (s - lv[i]) * (s > lv[i] ? 0.5 : 0.1);
    pk[i] = Math.max(pk[i] - 0.014, lv[i]);
    var lit = Math.round(lv[i] * NR), pkRow = Math.min(NR - 1, Math.round(pk[i] * NR));
    for (var j = 0; j < NR; j++) {
      var cxp = i * cw + cw / 2, cyp = H - (j * ch + ch / 2);
      var isLit = j < lit, isPk = on && j === pkRow && pkRow >= lit && pk[i] > 0.1;
      if (isLit) {
        var f = 0.45 + 0.55 * (j / (NR - 1));
        cx.fillStyle = 'rgba(' + col + ',' + f.toFixed(2) + ')';
        cx.shadowColor = 'rgba(' + col + ',.8)'; cx.shadowBlur = r * 1.6;
      } else if (isPk) {
        cx.fillStyle = 'rgba(' + col + ',.5)'; cx.shadowBlur = 0;
      } else {
        cx.fillStyle = 'rgba(255,255,255,.08)'; cx.shadowBlur = 0;
      }
      cx.beginPath(); cx.arc(cxp, cyp, r, 0, 6.2832); cx.fill();
    }
  }
  cx.shadowBlur = 0;
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas(); drawSpec();

/* ---------- bağlantı (WebSocket) ---------- */
function connectWs() {
  if (ws && ws.readyState <= 1) return;
  var w = new WebSocket(WSURL);
  ws = w;
  w.onopen = function () { retry = 0; };
  w.onmessage = function (e) {
    var d; try { d = JSON.parse(e.data); } catch (x) { return; }
    if (d.action === 'INIT_STATE') {
      $('cnt').textContent = d.listenerCount;
      var st = d.state || {};
      live = { isLive: !!st.isLive, mode: st.mode || 'cloud', sessionId: st.sessionId, trackName: st.trackName };
      if (d.now) setNow(d.now.title, d.now.duration, d.now.elapsed); else setNow('', 0, 0);
      render();
      if (!want) setMsg(live.isLive ? 'Yayın var, ▶ düğmesine basın' : 'Şu an yayın yok');
      syncAudio();
    } else if (d.action === 'LISTENER_COUNT') {
      $('cnt').textContent = d.count;
    } else if (d.action === 'NOW_PLAYING') {
      setNow(d.title, d.duration, d.elapsed);
    } else if (d.action === 'SET_LIVE') {
      if (d.live) live = { isLive: true, mode: d.mode || 'cloud', sessionId: d.sessionId, trackName: d.trackName };
      else { live = { isLive: false, mode: 'cloud', sessionId: null, trackName: null }; setNow('', 0, 0); }
      render();
      syncAudio();
    }
  };
  w.onclose = function () {
    if (ws !== w) return;
    ws = null;
    $('cnt').textContent = '-';
    setMsg('Bağlantı koptu, yeniden deneniyor...');
    retry++;
    clearTimeout(rtimer);
    rtimer = setTimeout(connectWs, Math.min(10000, 1000 * retry));
  };
}

$('btn').onclick = function () {
  if (want) { want = false; stopAudio(); try { au.pause(); } catch (e) {} setMsg('Durduruldu'); render(); return; }
  want = true; render();
  try { var C = window.AudioContext || window.webkitAudioContext; if (C && !AC) AC = new C(); if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {}
  au.src = SILENT;
  au.play().catch(function () {});
  connectWs();
  syncAudio();
};
document.addEventListener('click', function () {
  if (want && au.srcObject && au.paused) au.play().catch(function () {});
});
window.addEventListener('online', function () { clearTimeout(rtimer); connectWs(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) connectWs(); });

setInterval(tickClock, 1000); tickClock();
setInterval(tickProgress, 250);
render();
connectWs();
</script>
