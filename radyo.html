<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #d9dce5 0%, #c2c6d1 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .radio-container {
            max-width: 580px;
            width: 100%;
            background: radial-gradient(circle at 20% 30%, #e8eaef, #b9bfcc);
            border-radius: 3rem;
            box-shadow: 20px 20px 35px rgba(0, 0, 0, 0.3), -8px -8px 18px rgba(255, 255, 255, 0.6), inset 2px 2px 4px rgba(255,255,255,0.5), inset -3px -3px 6px rgba(0,0,0,0.1);

            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.7);
        }
        .radio-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .station-name {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #2d2f36, #1e2027);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .station-name i { color: #3a3f4b; font-size: 1.7rem; }
        .live-badge {
            background: #e33b3b;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.9rem;
            border-radius: 60px;
            text-transform: uppercase;
            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.1);
        }
        .live-badge.offline { background: #6c757d; color: #e9ecef; }
        @keyframes pulseLive {
            0% { opacity: 0.8; box-shadow: 0 0 0 0 rgba(227, 59, 59, 0.4);}
            70% { opacity: 1; box-shadow: 0 0 0 6px rgba(227,59,59,0);}
            100% { opacity: 0.8;}
        }
        .live-badge:not(.offline) { animation: pulseLive 1.2s infinite; }
        .song-info-panel {
            background: #0a0c12;
            border-radius: 2rem;
            padding: 1rem 1.2rem;
            margin: 1rem 0 1.3rem;
            box-shadow: inset 0 0 0 1px rgba(80, 220, 255, 0.2), 0 10px 20px rgba(0, 0, 0, 0.4);
        }
        .current-track { display: flex; flex-direction: column; gap: 0.75rem; }
        .visualizer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .equalizer {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 40px;
            background: rgba(0, 0, 0, 0.6);
            padding: 0 12px;
            border-radius: 30px;
            flex: 1;
        }
        .eq-bar {
            width: 4px;
            height: 12px;
            background: #0f0;
            border-radius: 2px;
            transition: height 0.08s ease;
            box-shadow: 0 0 4px #0f0;
        }
        .listener-count, .time-digital {
            background: #000000aa;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: #0aff9e;
            font-weight: 600;
            font-size: 0.85rem;
            backdrop-filter: blur(4px);
            border: 1px solid #2affaa30;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .track-marquee {
            background: #03060b;
            border-radius: 48px;
            padding: 0.35rem 1rem;
            overflow: hidden;
            border: 1px solid #2cffb0;
        }
        .marquee-content {
            display: flex;
            white-space: nowrap;
            animation: scrollText 14s linear infinite;
            gap: 2rem;
        }
        .marquee-content span { font-weight: 600; font-size: 0.9rem; color: #befff0; }
        .marquee-content i { color: #3eff9e; margin-right: 8px; }
        @keyframes scrollText {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .track-artist-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #9effd0;

            border-radius: 40px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.8rem;
            margin: 1.5rem 0 1rem;
        }
        .ctrl-btn {
            background: radial-gradient(circle at 30% 20%, #eff2f9, #c4cad9);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #2c2f3a;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 8px 8px 14px rgba(0, 0, 0, 0.25), -6px -6px 12px rgba(255, 255, 255, 0.7);
            border: none;
        }
        .ctrl-btn:active { transform: scale(0.96); }
        .play-pause { width: 85px; height: 85px; font-size: 2.5rem; }
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            background: rgba(0,0,0,0.1);
            padding: 0.5rem 1rem;
            border-radius: 60px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        input[type="range"] {
            width: 140px;
            height: 4px;
            -webkit-appearance: none;
            background: #3a3f4e;
            border-radius: 10px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #eef2ff;
            border-radius: 50%;
            cursor: pointer;
        }
        .chat-button {
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 2rem;
            padding: 0.9rem 1.2rem;
            margin: 1.2rem 0 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .chat-button:hover { transform: translateY(-3px); }
        .chat-button a {
            color: white;
            text-decoration: none;

        .credit {

            margin-top: 1.5rem;
            color: #2e3b4e;
        }
        .chat-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            max-width: 90vw;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);

            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            flex-direction: column;
            max-height: 85vh;
        }
        @media (max-width: 768px) {
            .chat-popup { width: 95vw; max-width: 95vw; max-height: 90vh; }
        }
        .chat-popup.active { display: flex; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        .chat-header {
            background: #075E54;
            color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .chat-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .admin-buttons { display: flex; gap: 8px; align-items: center; }
        .clear-all-btn {
            background: #e33b3b;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            display: none;
            align-items: center;
            gap: 4px;
        }
        .clear-all-btn:hover { background: #c0392b; }
        .chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        .chat-close:hover { background: rgba(255,255,255,0.2); }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: #ECE5DD;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 300px;
            max-height: 50vh;
            -webkit-overflow-scrolling: touch;
        }
        .chat-message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 0.85rem;
            word-break: break-word;
            position: relative;
        }
        .chat-message.received { background: white; align-self: flex-start; border-top-left-radius: 4px; }
        .chat-message.sent { background: #DCF8C6; align-self: flex-end; border-top-right-radius: 4px; }
        .chat-message-username { font-weight: 700; font-size: 0.7rem; color: #075E54; margin-bottom: 2px; }
        .chat-message-time { font-size: 0.6rem; color: #999; margin-top: 0.2rem; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
        .chat-system { text-align: center; font-size: 0.7rem; color: #666; margin: 0.3rem 0; }
        .read-receipt { font-size: 0.7rem; color: #4fc3f7; margin-left: 4px; }
        .read-receipt.delivered { color: #4fc3f7; }
        .read-receipt.read { color: #34b7f1; }
        .chat-input-area {
            display: flex;
            flex-direction: column;
            padding: 12px;
            background: #f0f0f0;
            gap: 10px;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
        }
        .chat-input-area input, .chat-input-area textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }
        .chat-input-area textarea { resize: none; }
        .chat-input-area button {
            background: #075E54;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }
        .chat-status {
            text-align: center;
            font-size: 0.65rem;
            padding: 8px;
            background: #f0f0f0;
            color: #666;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        .chat-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
        }
        .chat-overlay.active { display: block; }
        main { display: block; }
        @media (max-width: 550px) {
            .radio-container { padding: 1.2rem; }
            .ctrl-btn { width: 55px; height: 55px; font-size: 1.5rem; }
            .play-pause { width: 70px; height: 70px; font-size: 2rem; }
            .station-name { font-size: 1.4rem; }
            .equalizer { height: 32px; }
            .eq-bar { width: 3px; }
            .listener-count, .time-digital { padding: 0.2rem 0.6rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <main class="radio-container" id="radioContainer">
        <div class="radio-header">

        <div class="song-info-panel">
            <div class="current-track">
                <div class="visualizer-row">
                    <div class="equalizer" id="eqVisualizer">
                        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                    </div>

                </div>

                    </div>
                </div>
                <div class="track-artist-line" id="artistSubline">
                    <span><i class="fas fa-headphones"></i> <span id="subArtistText">VOM RADYO</span></span>
                    <span><i class="fas fa-waveform"></i> Kesintisiz Dijital Akış</span>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="ctrl-btn" id="playBtn" title="Başlat"><i class="fas fa-play"></i></button>
            <button class="ctrl-btn play-pause" id="mainPlayPause" title="Oynat / Duraklat"><i class="fas fa-play" id="playPauseIcon"></i></button>
            <button class="ctrl-btn" id="stopBtn" title="Durdur"><i class="fas fa-stop"></i></button>
        </div>
        <div class="volume-control">
            <i class="fas fa-volume-down"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
            <i class="fas fa-volume-up"></i>
        </div>
        <div class="chat-button" id="chatButtonSide">
            <a href="#"><i class="fab fa-whatsapp"></i> Canlı Sohbet</a>
        </div>
        <div class="credit">
            <i class="fas fa-shield-alt"></i> <span id="streamStatusText">Yayın hazır</span>
        </div>
    </main>

    <div class="chat-overlay" id="chatOverlay"></div>
    <div class="chat-popup" id="chatPopup">
        <div class="chat-header">
            <div class="chat-title"><i class="fab fa-whatsapp"></i> VOM Canlı Sohbet</div>
            <div class="admin-buttons">
                <button class="clear-all-btn" id="clearAllChatBtn">🗑️ Tümünü Sil</button>
                <button class="chat-close" id="chatCloseBtn">&times;</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-system">💬 VOM Canlı Sohbetine Hoş Geldiniz</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatUsername" placeholder="👤 Kullanıcı adınız">
            <textarea id="chatInput" placeholder="💬 Mesajınızı yazın (Enter gönder)" rows="1"></textarea>
            <button id="chatSendBtn"><i class="fas fa-paper-plane"></i> Gönder</button>
        </div>
        <div class="chat-status" id="chatStatus">Sohbet aktif.</div>
    </div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, push, onChildAdded, remove, set, onValue } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyCp-NfSJmRSTAAWrNla5tH2OY9wMr87mFA",
        authDomain: "vom-yayin.firebaseapp.com",
        projectId: "vom-yayin",
        storageBucket: "vom-yayin.firebasestorage.app",
        messagingSenderId: "93785669208",
        appId: "1:93785669208:web:ecccf7c03aa3ad6117d42d",
        databaseURL: "https://vom-yayin-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    const messagesRef = ref(rtdb, 'messages');
    const readReceiptsRef = ref(rtdb, 'readReceipts');

    const STREAM_URL = "https://radyo.vomyayin.dpdns.org/vomyayin";
    const STATUS_URL = "https://radyo.vomyayin.dpdns.org/status-json.xsl";
    
    // Ses nesnesi (Preload metadata)
    const audio = new Audio();
    audio.preload = "none";
    
    const playBtn = document.getElementById('playBtn');
    const mainPlayPause = document.getElementById('mainPlayPause');
    const stopBtn = document.getElementById('stopBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const liveBadge = document.getElementById('liveBadge');
    const volumeSlider = document.getElementById('volumeSlider');
    const streamStatusSpan = document.getElementById('streamStatusText');
    const marqueeSpan = document.getElementById('marqueeTrack');
    const subArtistSpan = document.getElementById('subArtistText');
    const liveDigitalClock = document.getElementById('liveDigitalClock');
    const listenerNumberSpan = document.getElementById('listenerNumber');
    const chatButtonSide = document.getElementById('chatButtonSide');
    const chatMessagesDiv = document.getElementById('chatMessages');
    const clearAllChatBtn = document.getElementById('clearAllChatBtn');
    const chatPopup = document.getElementById('chatPopup');
    const chatOverlay = document.getElementById('chatOverlay');
    const chatCloseBtn = document.getElementById('chatCloseBtn');
    const chatUsername = document.getElementById('chatUsername');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    
    let isPlaying = false;
    let isLiveActive = false;
    let eqAnimationId = null;
    let eqBars = [];
    let consecutiveStatusFails = 0;

    const sessionId = localStorage.getItem('vom_session_id') || 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    localStorage.setItem('vom_session_id', sessionId);
    const ADMIN_PASSWORD = "vomadmin202";

    function updateAdminButton() {
        if (clearAllChatBtn) {
            const currentUser = chatUsername?.value.trim() || '';
            clearAllChatBtn.style.display = (currentUser === 'admin') ? 'flex' : 'none';
        }
    }

    window.clearAllChatMessages = function() {
        const currentUser = chatUsername?.value.trim() || '';
        if (currentUser !== 'admin') { alert("Bu işlem için admin yetkisi gerekiyor."); return; }
        const pwd = prompt("Admin şifresi:");
        if (pwd === ADMIN_PASSWORD) {
            if (confirm("DİKKAT: Tüm sohbet geçmişini kalıcı olarak silmek istediğinize emin misiniz?")) {
                remove(messagesRef).then(() => {
                    alert("✅ Sohbet geçmişi başarıyla sıfırlandı!");
                    if (chatMessagesDiv) chatMessagesDiv.innerHTML = '<div class="chat-system">💬 Sohbet geçmişi temizlendi.</div>';
                }).catch((err) => alert("❌ Silme hatası: " + err.message));
            }
        } else if (pwd !== null) { alert("❌ Şifre yanlış!"); }
    };

    window.deleteChatMessage = function(messageId) {
        const currentUser = chatUsername?.value.trim() || '';
        if (currentUser !== 'admin') { alert("Bu işlem için admin yetkisi gerekiyor."); return; }
        const pwd = prompt("Admin şifresi:");
        if (pwd === ADMIN_PASSWORD) {
            remove(ref(rtdb, `messages/${messageId}`)).then(() => console.log("Mesaj silindi")).catch(() => alert("Silinemedi"));
        } else if (pwd !== null) { alert("Şifre yanlış!"); }
    };

    function markMessageAsRead(messageId) {
        if (!messageId) return;
        set(ref(rtdb, `readReceipts/${messageId}/${sessionId}`), true).catch(() => {});
    }

    function initEqualizer() {
        const barsContainer = document.getElementById('eqVisualizer');
        if(barsContainer) eqBars = Array.from(barsContainer.querySelectorAll('.eq-bar'));
        function animateEQ() {
            if(!isPlaying) {
                if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px');
                if(eqAnimationId) cancelAnimationFrame(eqAnimationId);
                eqAnimationId = null;
                return;
            }
            if(eqBars.length) {
                eqBars.forEach(bar => { bar.style.height = `${6 + Math.floor(Math.random() * 28)}px`; });
            }
            eqAnimationId = requestAnimationFrame(animateEQ);
        }
        animateEQ();
    }
    
    function updateDigitalClock() {
        const now = new Date();
        if (liveDigitalClock) liveDigitalClock.innerText = now.toLocaleTimeString('tr-TR');
    }
    setInterval(updateDigitalClock, 1000);
    updateDigitalClock();

    // ✅ TEK VE HAFİF STATUS KONTROLÜ (Icecast'i kilitlemez, her 20 sn'de bir sorgular)
    async function checkFullServerStatus() {
        try {
            const response = await fetch(STATUS_URL + '?_t=' + Date.now(), { cache: "no-store" });
            if (!response.ok) throw new Error("HTTP " + response.status);
            const data = await response.json();
            
            consecutiveStatusFails = 0; // Hata sayacını sıfırla

            let source = data.icestats?.source;
            if (Array.isArray(source)) source = source[0];

            if (source) {
                isLiveActive = true;
                liveBadge.classList.remove("offline");
                liveBadge.innerText = "CANLI";
                if (!isPlaying) streamStatusSpan.innerText = "Yayın hazır, başlatmak için Play";

                // Dinleyici sayısı
                const lCount = source.listeners !== undefined ? source.listeners : 0;
                if (listenerNumberSpan) listenerNumberSpan.innerText = lCount;

                // Parça Adı
                let currentTitle = source.title || source.metadata?.x_icy_title || null;
                if (!currentTitle && source.playlist?.trackList?.length > 0) {
                    currentTitle = source.playlist.trackList[source.playlist.trackList.length - 1]?.title;
                }

                if (currentTitle && currentTitle !== "null" && currentTitle !== "") {
                    let artist = "VOM RADYO";
                    let song = currentTitle;
                    if (currentTitle.includes(" - ")) {
                        const parts = currentTitle.split(" - ");
                        artist = parts[0].trim();
                        song = parts.slice(1).join(" - ").trim();
                    }
                    if (marqueeSpan) {
                        const esc = (t) => t.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
                        marqueeSpan.innerHTML = `<span><i class="fas fa-music"></i> ${esc(artist)} - ${esc(song)}</span><span><i class="fas fa-music"></i> ${esc(artist)} - ${esc(song)}</span>`;
                    }
                    if (subArtistSpan) subArtistSpan.innerText = artist;
                }
            } else {
                consecutiveStatusFails++;
                // ❌ ASLA audio.pause() YAPILMAZ! Sadece 4 kez üst üste teyit edilirse etiket güncellenir
                if (consecutiveStatusFails >= 4) {
                    liveBadge.classList.add("offline");
                    liveBadge.innerText = "YAYIN YOK";
                }
            }
        } catch(err) {
            consecutiveStatusFails++;
            console.warn("Geçici durum kontrol gecikmesi (Yayın devam ediyor):", err);
            // ❌ DÜZELTME: Eskiden burada audio.pause() vardı ve sesi kesiyordu, ARTIK SES KESİLMEZ!
            if (consecutiveStatusFails >= 5 && !isPlaying) {
                liveBadge.classList.add("offline");
                liveBadge.innerText = "BAĞLANTI YOK";
            }
        }
    }

    // İlk kontrol ve 20 saniyelik periyot
    checkFullServerStatus();
    setInterval(checkFullServerStatus, 20000);

    // ✅ SES OYNATICI VE KESİNTİSİZ ÇALMA MANTIĞI
    function playRadio() {
        // Cache bypass timestamp ile doğrudan en taze sese bağlan
        audio.src = STREAM_URL + "?live=" + Date.now();
        audio.volume = parseFloat(volumeSlider.value);
        streamStatusSpan.innerText = "🔄 Bağlanıyor...";

        audio.play().then(() => {
            isPlaying = true;
            playPauseIcon.className = "fas fa-pause";
            streamStatusSpan.innerText = "🔴 Canlı Yayın Oynatılıyor";
            initEqualizer();
        }).catch((err) => {
            console.warn("Play gecikmesi:", err);
            streamStatusSpan.innerText = "Yayın bekleniyor (Play basınız)";
            isPlaying = false;
            playPauseIcon.className = "fas fa-play";
        });
    }

    function pauseRadio() {
        audio.pause();
        isPlaying = false;
        playPauseIcon.className = "fas fa-play";
        streamStatusSpan.innerText = "Durduruldu";
        if (eqAnimationId) cancelAnimationFrame(eqAnimationId);
        eqAnimationId = null;
        if (eqBars.length) eqBars.forEach(b => b.style.height = '6px');
    }

    function stopRadio() {
        audio.pause();
        audio.src = "";
        isPlaying = false;
        playPauseIcon.className = "fas fa-play";
        streamStatusSpan.innerText = "Durduruldu";
        if (eqAnimationId) cancelAnimationFrame(eqAnimationId);
        eqAnimationId = null;
        if (eqBars.length) eqBars.forEach(b => b.style.height = '6px');
    }

    const togglePlay = () => { isPlaying ? pauseRadio() : playRadio(); };
    playBtn.onclick = togglePlay;
    mainPlayPause.onclick = togglePlay;
    stopBtn.onclick = stopRadio;
    volumeSlider.oninput = (e) => { audio.volume = parseFloat(e.target.value); };

    // ❌ ÖLÜMCÜL TUZAK SİLİNDİ:
    // "stalled" olayında asla audio.load() çağrılmaz! Tarayıcı hafif ağ gecikmesinde kendi kendine tamponlar.
    audio.addEventListener('playing', () => {
        isPlaying = true;
        playPauseIcon.className = "fas fa-pause";
        streamStatusSpan.innerText = "🔴 Canlı Yayın";
        if (!eqAnimationId) initEqualizer();
    });

    audio.addEventListener('waiting', () => {
        if (isPlaying) streamStatusSpan.innerText = "⏳ Tamponlanıyor...";
    });

    audio.addEventListener('error', (e) => {
        console.warn("Audio geçici akış beklemesi:", e);
        // Yayın akışında anlık kopma olursa 2 saniye sonra sessizce devam etmeyi dener
        if (isPlaying) {
            setTimeout(() => {
                if (isPlaying) {
                    audio.src = STREAM_URL + "?retry=" + Date.now();
                    audio.play().catch(() => {});
                }
            }, 2500);
        }
    });

    // SOHBET PENCERESİ VE MESAJLAR
    const escapeHtmlChat = (str) => { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); };

    chatButtonSide?.addEventListener('click', (e) => {
        e.preventDefault();
        chatPopup.classList.add('active');
        chatOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        updateAdminButton();
        loadExistingMessages();
    });

    chatCloseBtn?.addEventListener('click', () => {
        chatPopup.classList.remove('active');
        chatOverlay.classList.remove('active');
        document.body.style.overflow = '';
    });

    chatOverlay?.addEventListener('click', () => {
        chatPopup.classList.remove('active');
        chatOverlay.classList.remove('active');
        document.body.style.overflow = '';
    });

    function sendChatMessage() {
        const username = chatUsername?.value.trim();
        const message = chatInput?.value.trim();
        if (!message) return;
        const finalUsername = (username || 'Anonim').substring(0, 20);
        push(messagesRef, { 
            username: finalUsername, 
            message: message.substring(0, 500), 
            timestamp: Date.now(),
            senderId: sessionId
        }).then(() => { if(chatInput) chatInput.value = ''; }).catch(() => {});
    }

    function renderMessage(messageId, data) {
        if (!chatMessagesDiv) return;
        if (document.getElementById(`msg-${messageId}`)) return;
        
        const currentUser = chatUsername?.value.trim() || '';
        const messageSender = data.username || 'Anonim';
        const isSelf = (data.senderId === sessionId);
        const timeStr = data.timestamp ? new Date(data.timestamp).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
        
        const div = document.createElement('div');
        div.className = isSelf ? 'chat-message sent' : 'chat-message received';
        div.id = `msg-${messageId}`;
        div.dataset.messageId = messageId;
        
        let readHtml = isSelf ? `<span class="read-receipt delivered" id="read-${messageId}">✓✓</span>` : '';
        
        div.innerHTML = `<div class="chat-message-username">${escapeHtmlChat(messageSender)}</div>${escapeHtmlChat(data.message)}<div class="chat-message-time">${timeStr} ${readHtml}</div>`;
        
        if (currentUser === 'admin' && !isSelf) {
            div.innerHTML += `<button onclick="window.deleteChatMessage('${messageId}')" style="margin-left:8px; background:#e33b3b; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; color:white; font-size:10px;">🗑</button>`;
        }
        
        chatMessagesDiv.appendChild(div);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
        while (chatMessagesDiv.children.length > 150) chatMessagesDiv.removeChild(chatMessagesDiv.firstChild);
        
        if (!isSelf && chatPopup.classList.contains('active')) {
            setTimeout(() => markMessageAsRead(messageId), 500);
        }
    }

    function loadExistingMessages() {
        if (!chatMessagesDiv) return;
        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            chatMessagesDiv.innerHTML = '';
            if (!data) {
                chatMessagesDiv.innerHTML = '<div class="chat-system">💬 Henüz mesaj yok. İlk mesajı siz yazın!</div>';
                return;
            }
            const sorted = Object.entries(data)
                .map(([id, val]) => ({ id, ...val }))
                .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            sorted.forEach(msg => renderMessage(msg.id, msg));
            chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
        });
    }

    onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        if (!data?.message) return;
        renderMessage(snapshot.key, data);
    });

    onValue(readReceiptsRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        document.querySelectorAll('.chat-message.sent').forEach(el => {
            const msgId = el.dataset.messageId;
            if (!msgId) return;
            const readers = data[msgId];
            if (readers) {
                const count = Object.keys(readers).length;
                const r = el.querySelector('.read-receipt');
                if (r) {
                    r.className = count > 1 ? 'read-receipt read' : 'read-receipt delivered';
                    r.textContent = '✓✓';
                }
            }
        });
    });

    clearAllChatBtn?.addEventListener('click', window.clearAllChatMessages);
    chatSendBtn?.addEventListener('click', sendChatMessage);
    chatInput?.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); } });
    
    const savedUsername = localStorage.getItem('vom_chat_username');
    if (savedUsername && chatUsername) chatUsername.value = savedUsername;
    chatUsername?.addEventListener('change', () => { 
        if(chatUsername.value.trim()) localStorage.setItem('vom_chat_username', chatUsername.value.trim());
        updateAdminButton();
    });
    updateAdminButton();
</script>
</body>
</html>
