<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>VOM Radyo | VOM-VOMITORIUM Kültür Sanat Blogu</title>
<style>
/* Dijital font sadece özel yerlerde kullanılacak */
@font-face{font-family:'SEVEN';src:url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2') format('woff2');font-display:swap}
:root{
  --blue:#2f8cff; --hl:#4da3ff; --clk:#8ec8ff; --soft:#8190a3; --lt:#a3afbf; --glow:rgba(110,180,255,.5);
  --red:#ff3b3b; --dig:'SEVEN','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  min-height:100vh;min-height:100dvh;
  background:radial-gradient(60% 40% at 15% 8%,rgba(47,140,255,.28),transparent 70%),#070b12;
  /* TÜM SAYFA NORMAL FONT */
  color:#dbe7f3;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  display:flex;justify-content:center;align-items:flex-start;
  padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
}
body.cloud{--accent:var(--blue);--soft:#8db4de;--lt:#b4d4f7}
body.live{--accent:var(--red);--hl:#ff4545;--clk:#ff8f8f;--soft:#ff9b9b;--lt:#ffbcbc;--glow:rgba(255,70,70,.5)}
.wrap{width:100%;max-width:430px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:4px 2px 18px}
.brand h1{margin:0;font-size:clamp(25px,8vw,34px);font-weight:800;letter-spacing:.06em;line-height:1;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 22px var(--glow)}
.brand h1 .v,.brand h1 .r{color:var(--hl)}
.brand p{margin:7px 0 0;font-size:10.5px;letter-spacing:.32em;color:var(--soft);white-space:nowrap}
/* SADECE SAAT DİJİTAL */
.clock{display:flex;flex-direction:column;align-items:stretch;font-family:var(--dig);white-space:nowrap}
.clock .d{display:flex;justify-content:space-between;font-size:15px;color:var(--lt);margin-top:5px}
.clock .t{display:block;font-size:clamp(23px,7vw,30px);color:var(--clk);text-shadow:0 0 10px var(--glow);letter-spacing:0}

.glass{position:relative;border-radius:30px;padding:20px 18px 18px;overflow:hidden;
  background:linear-gradient(155deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 38%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.09) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(255,255,255,.20);
  box-shadow:0 28px 50px -12px rgba(0,0,0,.75),inset 0 1.5px 0 rgba(255,255,255,.45);
}
/* NORMAL FONT */
.row1{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.14em;color:var(--lt);white-space:nowrap;gap:8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;}
.row1 .rt{font-family:var(--dig);font-weight:400;letter-spacing:.08em;font-size:15px}

.banner{display:none;align-items:center;justify-content:center;gap:10px;margin:12px 0 0;font-weight:800;font-size:11px;letter-spacing:.1em;white-space:nowrap;color:var(--red);text-shadow:0 0 12px rgba(255,59,59,.7)}
body.live .banner{display:flex}
.banner .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1s steps(2,start) infinite}
.banner .oa{border:1.5px solid var(--red);border-radius:6px;padding:2px 6px 2px 8px;letter-spacing:.18em;white-space:nowrap;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}

/* KAYAN YAZI DİJİTAL */
.mq{overflow:hidden;white-space:nowrap;height:40px;line-height:40px;margin:12px -4px 4px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.tk{display:inline-flex;white-space:nowrap;animation:mq var(--d,12s) linear infinite}
.tk span{display:inline-block;padding-right:56px;font-family:var(--dig);font-size:24px;letter-spacing:.06em;color:var(--soft);text-shadow:0 0 12px var(--glow)}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(calc(-1px * var(--w,300)))}}

.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin:8px 0 10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.7));box-shadow:0 0 8px var(--accent)}
/* SÜRELER DİJİTAL, MOD YAZISI NORMAL */
.row3{display:flex;justify-content:space-between;align-items:center;font-family:var(--dig);font-size:15px;white-space:nowrap}
.row3 .tm{color:var(--lt)}
.row3 .md{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:9px;font-weight:600;letter-spacing:.12em;color:var(--accent);opacity:.5}

.ctl{display:flex;justify-content:center;margin:12px 0 4px}
#btn{width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.35);cursor:pointer;color:#fff;padding:0;
  background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.55),rgba(255,255,255,.10) 45%,rgba(255,255,255,.04) 70%),linear-gradient(160deg,var(--accent),var(--accent));
  box-shadow:0 14px 26px -6px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;
}
#btn svg{width:30px;height:30px;fill:#fff}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--lt);opacity:.85;min-height:20px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;}
.mw{display:flex;align-items:center;min-width:0}
.pd{display:none;flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);margin-right:9px}
.pd.on{display:inline-block}
#msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.lc{display:flex;align-items:center;gap:5px;font-family:var(--dig);font-size:14px;color:var(--lt);white-space:nowrap}
.lc svg{width:13px;height:13px;fill:none;stroke:var(--lt);stroke-width:2}

.chat-link{text-align:center;margin:16px 0 6px;white-space:nowrap}
.chat-link a{display:inline-flex;align-items:center;gap:10px;font-family:var(--dig);font-size:18px;letter-spacing:.22em;color:var(--clk);text-shadow:0 0 12px var(--glow);text-decoration:none;padding:10px 24px;border-radius:14px;border:1px solid rgba(142,200,255,.32);background:rgba(255,255,255,.05);transition:all .18s}
.chat-link a:hover{color:#fff;border-color:var(--hl)}
.chat-link a .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

.cp{text-align:center;font-family:var(--dig);font-size:14px;letter-spacing:.2em;color:rgba(195,210,230,.75);margin:22px 0 8px;white-space:nowrap}
</style></head>
<body class="cloud">
<div class="wrap">

<div class="top">
  <div class="brand">
    <h1><span class="v">VOM</span> <span class="r">RADYO</span></h1>
    <p>DİJİTAL WEB RADYO</p>
  </div>
  <div class="clock"><span class="t" id="clk">--:--:--</span><span class="d" id="dt">--.--.----</span></div>
</div>

<div class="glass">
  <div class="row1"><span>ÇALAN ŞARKI / NOW PLAYING</span><span class="rt">STEREO / 48kHz</span></div>
  <div class="banner"><span class="dot"></span><span>VOM RADYO CANLI YAYINDA</span><span class="oa">ON AIR</span></div>
  <div class="mq" id="mq"><div class="tk" id="tk"><span>VOM RADYO</span></div></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="row3"><span class="tm" id="el">00:00</span><span class="md" id="md">BULUT YAYIN MODU</span><span class="tm" id="tt">00:00</span></div>
  <div class="ctl">
    <button id="btn" aria-label="Dinle / Durdur">
      <svg class="pl" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>
      <svg class="ps" viewBox="0 0 24 24" style="display:none"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
    </button>
  </div>
  <div class="foot">
    <span class="mw"><i class="pd" id="pd"></i><span id="msg">Hazır</span></span>
    <span class="lc" title="Dinleyici"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><b id="cnt">-</b></span>
  </div>
</div>

<div class="chat-link"><a href="https://vom-blog.com/sohbet" target="_blank" rel="noopener"><span class="dot"></span><span>VOM SOHBET</span></a></div><div class="cp">COPYRIGHT VOM RADYO</div>

</div>
<audio id="au" playsinline></audio>

<script>
var HOST = 'radyo-yayin.guryuc.workers.dev';
var API = 'https://' + HOST;
var want = false;
var au = document.getElementById('au');
var live = { isLive: false, mode: 'cloud' };
var np = { title: 'VOM RADYO' };

function $(id) { return document.getElementById(id); }
function setMsg(t) { $('msg').textContent = t; }
function pad2(n) { n = Math.floor(n); return (n < 10 ? '0' : '') + n; }

function dig(t) {
  var m = { 'ğ':'g','Ğ':'G','ş':'s','Ş':'S','ı':'i','İ':'I','ö':'o','Ö':'O','ü':'u','Ü':'U','ç':'c','Ç':'C' };
  return String(t).replace(/[ğĞşŞıİöÖüÜçÇ]/g, function (c) { return m[c]; }).replace(/[’'`´]/g, ' ').replace(/[–—]/g, '-').toUpperCase();
}

var tf = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Istanbul', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
var MONTHS = ['OCAK','SUBAT','MART','NISAN','MAYIS','HAZIRAN','TEMMUZ','AGUSTOS','EYLUL','EKIM','KASIM','ARALIK'];
function tickClock() {
  var d = new Date();
  var o = { day: d.getDate(), month: d.getMonth() + 1, year: d.getFullYear() };
  try { var p = tf.formatToParts(d); for (var i = 0; i < p.length; i++) if (o.hasOwnProperty(p[i].type)) o[p[i].type] = parseInt(p[i].value, 10); } catch (e) {}
  $('clk').textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  $('dt').innerHTML = '<span>' + o.day + '</span><span>' + MONTHS[o.month - 1] + '</span><span>' + o.year + '</span>';
}

var mqText = 'VOM RADYO';
function layoutMq() {
  var mq = $('mq'), tk = $('tk');
  tk.textContent = '';
  var s = document.createElement('span'); s.textContent = mqText; tk.appendChild(s);
  var unit = s.offsetWidth || 200, c = mq.clientWidth || 300;
  var n = Math.ceil(c / unit) + 1;
  for (var i = 1; i < n; i++) { var x = document.createElement('span'); x.textContent = mqText; tk.appendChild(x); }
  tk.style.setProperty('--w', unit);
  tk.style.setProperty('--d', (unit / 45).toFixed(1) + 's');
}
function setMq(text) { text = dig(text); if (text === mqText) return; mqText = text; layoutMq(); }
window.addEventListener('resize', layoutMq);

function render() {
  var mode = live.isLive ? (live.mode === 'live' ? 'live' : 'cloud') : 'cloud';
  document.body.className = mode;
  $('md').textContent = mode === 'live' ? 'CANLI YAYIN MODU' : 'BULUT YAYIN MODU';
  $('btn').className = want ? 'on' : '';
  setMq(np.title || 'VOM RADYO');
}

function listen() {
  if (!want) return;
  setMsg('Yayın açılıyor...');
  $('pd').className = 'pd on';
  if (live.isLive) {
    au.src = API + '/stream.mp3?t=' + Date.now();
  } else {
    au.src = API + '/cloud.mp3?t=' + Date.now();
  }
  au.play().catch(function () { setMsg('Sese başlamak için dokunun'); });
  updateMediaSession();
}

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: np.title || 'Vom Radyo', artist: 'Vom Radyo' });
    navigator.mediaSession.playbackState = (want && !au.paused) ? 'playing' : 'paused';
    navigator.mediaSession.setActionHandler('play', function () { want = true; render(); listen(); });
    navigator.mediaSession.setActionHandler('pause', function () { want = false; render(); stopAudio(); setMsg('Durduruldu'); });
  } catch (e) {}
}

function stopAudio() {
  try { au.pause(); } catch (e) {}
  au.removeAttribute('src');
  try { au.load(); } catch (e) {}
  $('pd').className = 'pd';
}

au.addEventListener('playing', function () {
  setMsg('Canlı dinliyorsunuz');
  $('pd').className = 'pd on';
});

au.addEventListener('error', function () {
  if (!want) return;
  setMsg('Yayın akışı bekleniyor...');
  setTimeout(function () { if (want) listen(); }, 3000);
});

$('btn').onclick = function () {
  if (want) { want = false; stopAudio(); setMsg('Durduruldu'); render(); return; }
  want = true; render(); listen();
};

setInterval(tickClock, 1000); tickClock();
layoutMq();
render();
</script>
</body></html>
