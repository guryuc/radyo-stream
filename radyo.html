            clearAllChatBtn.style.display = (currentUser === 'admin') ? 'flex' : 'none';

    // --- TÜM SOHBETİ SİL ---
    window.clearAllChatMessages = function() {
        const currentUser = chatUsername?.value.trim() || '';
        if (currentUser !== 'admin') {
            alert("Bu işlem için admin yetkisi gerekiyor.");
            return;
        }
        const pwd = prompt("Admin şifresi:");
        if (pwd === ADMIN_PASSWORD) {
            if (confirm("DİKKAT: Tüm sohbet geçmişini kalıcı olarak silmek istediğinize emin misiniz?")) {
                remove(messagesRef)
                    .then(() => {
                        alert("✅ Sohbet geçmişi başarıyla sıfırlandı!");
                        if (chatMessagesDiv) {

                    })
                    .catch((err) => alert("❌ Silme hatası: " + err.message));
            }
        } else if (pwd !== null) {
            alert("❌ Şifre yanlış!");
        }
    };

        }
        const pwd = prompt("Admin şifresi:");
        if (pwd === ADMIN_PASSWORD) {
            remove(ref(rtdb, `messages/${messageId}`))
                .then(() => console.log("Mesaj silindi"))
                .catch(() => alert("Silinemedi"));
        } else if (pwd !== null) {
            alert("Şifre yanlış!");
        }
    };

    // --- OKUNDU BİLDİRİMİ GÖNDER ---
    function markMessageAsRead(messageId) {
        if (!messageId) return;
        // Bu mesajı okuyan kullanıcıyı kaydet
        set(ref(rtdb, `readReceipts/${messageId}/${sessionId}`), true)
            .catch(() => {});
    }

    // --- DİĞER FONKSİYONLAR (RADYO) ---
    async function fetchListenerCount() {
        if (!isLiveActive) return;
        try {
            const response = await fetch(STATUS_URL);
            const data = await response.json();
            let listeners = 0;
            if (data.icestats?.source) {
                const sources = data.icestats.source;
                if (Array.isArray(sources)) {
                    listeners = sources.reduce((total, src) => total + (parseInt(src.listeners) || 0), 0);
                } else {
                    listeners = parseInt(sources.listeners) || 0;
                }
            }
            if (listenerNumberSpan) listenerNumberSpan.innerText = listeners;
        } catch(e) {}
    }
    
    function startListenerUpdater() {
        if (listenerInterval) clearInterval(listenerInterval);
        listenerInterval = setInterval(() => { if (isPlaying && isLiveActive) fetchListenerCount(); }, 15000);
        if (isLiveActive) fetchListenerCount();
    }
    
    function initEqualizer() {
        const barsContainer = document.getElementById('eqVisualizer');
        if(barsContainer) eqBars = Array.from(barsContainer.querySelectorAll('.eq-bar'));
        function animateEQ() {
            if(!isPlaying || !isLiveActive) {
                if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px');
                if(eqAnimationId) cancelAnimationFrame(eqAnimationId);
                eqAnimationId = null;
                return;
            }
            if(eqBars.length) {
                eqBars.forEach(bar => {
                    bar.style.height = `${6 + Math.floor(Math.random() * 28)}px`;
                });
            }
            eqAnimationId = requestAnimationFrame(animateEQ);
        }
        animateEQ();
    }
    
    function updateDigitalClock() {
        const now = new Date();
        liveDigitalClock.innerText = now.toLocaleTimeString('tr-TR');
    }
    setInterval(updateDigitalClock, 200);
    updateDigitalClock();
    
    async function fetchMetadata() {
        if (!isLiveActive) return;
        try {
            const response = await fetch(STATUS_URL);
            const data = await response.json();
            let currentTitle = null;
            let currentArtist = null;
            if (data.icestats?.source?.playlist?.trackList) {
                const trackList = data.icestats.source.playlist.trackList;
                if (Array.isArray(trackList) && trackList.length > 0) {
                    const lastTrack = trackList[trackList.length - 1];
                    if (lastTrack?.title && lastTrack.title !== "null") {
                        const parts = lastTrack.title.split(" - ");
                        if (parts.length >= 2) {
                            currentArtist = parts[0].trim();
                            currentTitle = parts.slice(1).join(" - ").trim();
                        } else {
                            currentTitle = lastTrack.title.trim();
                        }
                    }
                }
            }
            if (!currentTitle && data.icestats?.source?.metadata?.["x_icy_title"]) {
                const icyTitle = data.icestats.source.metadata["x_icy_title"];
                if (icyTitle && icyTitle !== "null") {
                    const parts = icyTitle.split(" - ");
                    if (parts.length >= 2) {
                        currentArtist = parts[0].trim();
                        currentTitle = parts.slice(1).join(" - ").trim();
                    } else {
                        currentTitle = icyTitle.trim();
                    }
                }
            }
            if (!currentTitle && data.icestats?.source?.title && data.icestats.source.title !== "null") {
                const parts = data.icestats.source.title.split(" - ");
                if (parts.length >= 2) {
                    currentArtist = parts[0].trim();
                    currentTitle = parts.slice(1).join(" - ").trim();
                } else {
                    currentTitle = data.icestats.source.title.trim();
                }
            }
            if (currentTitle && currentTitle !== "") {
                const displayText = currentArtist ? `${currentArtist} - ${currentTitle}` : currentTitle;
                const cleanText = displayText.substring(0, 60);
                const escapeHtml = (str) => str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
                marqueeSpan.innerHTML = `<span><i class="fas fa-music"></i> ${escapeHtml(cleanText)}</span><span><i class="fas fa-music"></i> ${escapeHtml(cleanText)}</span>`;
                if(subArtistSpan) subArtistSpan.innerText = currentArtist || "VOM RADYO";
            }
        } catch(e) {}
    }
    
    function startMetadataUpdater() {
        if (metadataInterval) clearInterval(metadataInterval);
        metadataInterval = setInterval(() => { if (isPlaying && isLiveActive) fetchMetadata(); }, 2000);
        if (isLiveActive) fetchMetadata();
    }
    
    async function checkStreamStatus() {
        try {
            const response = await fetch(STATUS_URL);
            const data = await response.json();
            const source = data.icestats?.source;
            let hasSource = false;
            if (source) {
                if (source.listeners !== undefined || source.title !== null || source.playlist?.trackList?.length > 0) {
                    hasSource = true;
                }
                if (!hasSource && source.server_type === "audio/mpeg") {
                    hasSource = true;
                }
            }
            if (hasSource) {
                if (!isLiveActive) {
                    isLiveActive = true;
                    liveBadge.classList.remove("offline");
                    liveBadge.innerText = "CANLI";
                    streamStatusSpan.innerText = "Yayın hazır, başlatmak için Play";
                    if (chatButtonSide) chatButtonSide.classList.remove("offline");
                    const chatStatusDiv = document.getElementById('chatStatus');
                    if (chatStatusDiv) chatStatusDiv.innerText = "💬 Sohbet aktif, yayın devam ediyor!";
                }
            } else {
                if (isLiveActive || isPlaying) {
                    if (isPlaying) {
                        audio.pause();
                        isPlaying = false;
                        playPauseIcon.className = "fas fa-play";
                    }
                    isLiveActive = false;
                    liveBadge.classList.add("offline");
                    liveBadge.innerText = "YAYIN YOK";
                    streamStatusSpan.innerText = "Yayın kapalı";
                    if (chatButtonSide) chatButtonSide.classList.add("offline");
                    const chatStatusDiv = document.getElementById('chatStatus');
                    if (chatStatusDiv) chatStatusDiv.innerText = "Yayın aktif değil, sohbet kapalı.";
                    
                    remove(messagesRef).catch(err => console.error("Chat temizlenemedi:", err));
                    remove(readReceiptsRef).catch(err => console.error("Okundu bilgileri temizlenemedi:", err));
                    
                    if (metadataInterval) clearInterval(metadataInterval);
                    if (listenerInterval) clearInterval(listenerInterval);
                    if (eqAnimationId) cancelAnimationFrame(eqAnimationId);
                    eqAnimationId = null;
                    if (eqBars.length) eqBars.forEach(bar => bar.style.height = '6px');
                    if (listenerNumberSpan) listenerNumberSpan.innerText = "0";
                    
                    marqueeSpan.innerHTML = `<span><i class="fas fa-music"></i> Yayın Bekleniyor</span><span><i class="fas fa-music"></i> Yayın Bekleniyor</span>`;
                    if(subArtistSpan) subArtistSpan.innerText = "VOM RADYO";
                }
            }
        } catch(e) {
            if (isLiveActive || isPlaying) {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    playPauseIcon.className = "fas fa-play";
                }
                isLiveActive = false;
                liveBadge.classList.add("offline");
                liveBadge.innerText = "BAĞLANTI YOK";
                streamStatusSpan.innerText = "Sunucuya bağlanılamıyor";
                if (chatButtonSide) chatButtonSide.classList.add("offline");
                const chatStatusDiv = document.getElementById('chatStatus');
                if (chatStatusDiv) chatStatusDiv.innerText = "Sunucu bağlantısı yok.";
                remove(messagesRef).catch(() => {});
                remove(readReceiptsRef).catch(() => {});
            }
        }
    }
    
    function attemptReconnect() {
        if (!isPlaying) return;
        reconnectAttempt++;
        if (reconnectAttempt > 3) { 
            if (chatButtonSide) chatButtonSide.classList.add("offline");
            reconnectAttempt = 0; 
            return; 
        }
        streamStatusSpan.innerText = `🔄 Yeniden bağlanıyor (${reconnectAttempt}/3)...`;
        setTimeout(() => { if (isPlaying) { audio.load(); audio.play().catch(() => {}); } }, 2000);
    }
    
    function initAudioEvents() {
        audio.addEventListener('error', () => { if (isPlaying && isLiveActive) attemptReconnect(); });
        audio.addEventListener('stalled', () => { if (isPlaying && isLiveActive && audio.readyState < 2) attemptReconnect(); });
        audio.addEventListener('canplay', () => { audio.volume = parseFloat(volumeSlider.value); });
        audio.addEventListener('playing', () => { 
            startMetadataUpdater(); 
            startListenerUpdater(); 
            if(!eqAnimationId) initEqualizer(); 
            reconnectAttempt = 0;
            streamStatusSpan.innerText = "🔴 Canlı yayın";
        });
        audio.addEventListener('pause', () => { 
            if (metadataInterval) clearInterval(metadataInterval); 
            if (listenerInterval) clearInterval(listenerInterval); 
            if(eqAnimationId) cancelAnimationFrame(eqAnimationId); 
            eqAnimationId = null; 
            if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px'); 
        });
    }
    
    function playRadio() {
        if (!isLiveActive) {
            alert("📻 Yayın şu anda aktif değil.");
            return;
        }
        audio.play().then(() => {
            isPlaying = true;
            playPauseIcon.className = "fas fa-pause";
            initEqualizer();
            startListenerUpdater();
            startMetadataUpdater();
        }).catch((err) => { 
            console.error("Play hatası:", err);
            alert("Yayın bağlantısı kurulamadı."); 
        });
    }
    
    function pauseRadio() {
        audio.pause();
        isPlaying = false;
        playPauseIcon.className = "fas fa-play";
        streamStatusSpan.innerText = "Durduruldu";
        if (metadataInterval) clearInterval(metadataInterval);
        if (listenerInterval) clearInterval(listenerInterval);
        if(eqAnimationId) cancelAnimationFrame(eqAnimationId);
        eqAnimationId = null;
        if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px');
        if (listenerNumberSpan) listenerNumberSpan.innerText = "0";
    }
    
    function stopRadio() {
        audio.pause();
        audio.currentTime = 0;
        isPlaying = false;
        playPauseIcon.className = "fas fa-play";
        streamStatusSpan.innerText = "Durduruldu";
        if (metadataInterval) clearInterval(metadataInterval);
        if (listenerInterval) clearInterval(listenerInterval);
        if(eqAnimationId) cancelAnimationFrame(eqAnimationId);
        eqAnimationId = null;
        if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px');
        if (listenerNumberSpan) listenerNumberSpan.innerText = "0";
    }
    
    const togglePlay = () => { isPlaying ? pauseRadio() : playRadio(); };
    playBtn.onclick = togglePlay;
    mainPlayPause.onclick = togglePlay;
    stopBtn.onclick = () => { if (isPlaying) stopRadio(); else { audio.pause(); audio.currentTime = 0; streamStatusSpan.innerText = "Durduruldu"; if(eqAnimationId) cancelAnimationFrame(eqAnimationId); if(eqBars.length) eqBars.forEach(b => b.style.height='6px'); if(listenerNumberSpan) listenerNumberSpan.innerText = "0";} };
    volumeSlider.addEventListener('input', (e) => { audio.volume = parseFloat(e.target.value); });
    
    initAudioEvents();
    audio.volume = volumeSlider.value;
    initEqualizer();
    
    checkStreamStatus();
    statusCheckInterval = setInterval(checkStreamStatus, 30000);
    
    // --- CHAT MESAJLAŞMA ---
    const escapeHtmlChat = (str) => { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); };
    
    chatButtonSide?.addEventListener('click', (e) => {
        e.preventDefault();
        if (isLiveActive) {
            chatPopup.classList.add('active');
            chatOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            updateAdminButton();
        } else { 
            alert("Sohbet sadece canlı yayında açıktır."); 
        }
    });
    
    chatCloseBtn?.addEventListener('click', () => {
        chatPopup.classList.remove('active');
        chatOverlay.classList.remove('active');
        document.body.style.overflow = '';
    });
    
    chatOverlay?.addEventListener('click', () => {
        chatPopup.classList.remove('active');
        chatOverlay.classList.remove('active');
        document.body.style.overflow = '';
    });
    
function sendChatMessage() {
    if (!isLiveActive) { 
        alert("Sohbet sadece canlı yayında açıktır."); 
        return; 
    }
    const username = chatUsername?.value.trim();
    const message = chatInput?.value.trim();
    if (!message) return;
    
   // ✅ YENİ EKLENEN KISIM (Gelişmiş Gerçek İsim Kontrolü)
    const temizIsim = username.toLowerCase().trim();
    const SADECE_HARF_KURALI = /^[a-zA-ZğüşıöçĞÜŞİÖÇ\s]{2,20}$/;
    
    // 1. Bilinen sahte ve trol isimler
    const YASAKLI_ISIMLER = [
        "", "misafir", "guest", "anonim", "anonymous", "isimsiz", 
        "kimse", "biri", "deneme", "test", "admin", "moderator", 
        "radyo", "yayinci", "dj", "asdasd", "qwerty", "dinleyici", "user"
    ];

    // 2. Kontroller:
    const yasakliMi = YASAKLI_ISIMLER.some(yasak => temizIsim.includes(yasak));
    const harfUygunMu = SADECE_HARF_KURALI.test(username);
    const sesliHarfVarMi = /[aeıioöuü]/.test(temizIsim); // 'dfgh' gibi sessiz harf sallamalarını eler
    const ayniHarfTekrari = /(.)\1{2,}/.test(temizIsim); // 'aaaa', 'zzzz' gibi tekrarları eler
    const sessizYigilmasi = /[bcçdfgğhjklmnprsştvyz]{4,}/.test(temizIsim); // Arka arkaya 4 sessiz harf engeller

    if (!username || yasakliMi || !harfUygunMu || !sesliHarfVarMi || ayniHarfTekrari || sessizYigilmasi) {
        alert("❌ Lütfen sadece gerçek adınızı yazın! (Nokta, sembol, sahte isimler veya anlamsız rastgele harfler kabul edilmez)");
        chatUsername?.focus();
        return; // Mesaj GÖNDERİLMEZ
    }
    // ✅ KONTROL BİTTİ
    
    const finalUsername = username.substring(0, 20);
    push(messagesRef, { 
        username: finalUsername, 
        message: message.substring(0, 500), 
        timestamp: Date.now(),
        senderId: sessionId
    }).then(() => { if(chatInput) chatInput.value = ''; }).catch(() => {});
}

    // --- MESAJ GELDİĞİNDE OKUNDU İŞARETLE ---
    function markAllMessagesAsRead() {
        // Chat açıkken tüm mesajları okundu olarak işaretle
        if (!isLiveActive || !chatPopup.classList.contains('active')) return;
        const messageElements = chatMessagesDiv.querySelectorAll('.chat-message:not(.sent)');
        messageElements.forEach(el => {
            const msgId = el.dataset.messageId;
            if (msgId) {
                markMessageAsRead(msgId);
            }
        });
    }

    // Her 3 saniyede bir okundu bildirimi gönder
    let readInterval = setInterval(markAllMessagesAsRead, 3000);
    
    // --- YENİ MESAJ DİNLEYİCİSİ (Okundu bilgisi ile) ---
    onChildAdded(messagesRef, (snapshot) => {
        if (!isLiveActive || !chatMessagesDiv) return;
        const data = snapshot.val();
        if (!data?.message) return;
        
        const messageId = snapshot.key;
        const currentUser = chatUsername?.value.trim() || '';
        const messageSender = data.username || 'Anonim';
        const isSelf = (data.senderId === sessionId);
        const timeStr = data.timestamp ? new Date(data.timestamp).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
        
        const div = document.createElement('div');
        div.className = isSelf ? 'chat-message sent' : 'chat-message received';
        div.id = `msg-${messageId}`;
        div.dataset.messageId = messageId;
        
        // Okundu bilgisi için placeholder
        let readHtml = '';
        if (isSelf) {
            // Gönderen kişi için çift tik gösterimi
            readHtml = `<span class="read-receipt delivered" id="read-${messageId}">✓✓</span>`;
        }
        
        div.innerHTML = `<div class="chat-message-username">${escapeHtmlChat(messageSender)}</div>${escapeHtmlChat(data.message)}<div class="chat-message-time">${timeStr} ${readHtml}</div>`;
        
        if (currentUser === 'admin' && !isSelf) {
            div.innerHTML += `<button onclick="window.deleteChatMessage('${messageId}')" style="margin-left:8px; background:#e33b3b; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; color:white; font-size:10px;">🗑</button>`;
        }
        
        chatMessagesDiv.appendChild(div);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
        while (chatMessagesDiv.children.length > 150) chatMessagesDiv.removeChild(chatMessagesDiv.firstChild);
        
        // Eğer bu mesaj benim değilse ve sohbet açıksa okundu işaretle
        if (!isSelf && chatPopup.classList.contains('active')) {
            setTimeout(() => markMessageAsRead(messageId), 500);
        }
    });

    // --- OKUNDU BİLGİLERİNİ DİNLE ---
    onValue(readReceiptsRef, (snapshot) => {
        if (!isLiveActive) return;
        const data = snapshot.val();
        if (!data) return;
        
        // Her mesaj için kaç kişi okuduğunu kontrol et
        document.querySelectorAll('.chat-message.sent').forEach(el => {
            const msgId = el.dataset.messageId;
            if (!msgId) return;
            const readers = data[msgId];
            if (readers) {
                const readerCount = Object.keys(readers).length;
                const receiptEl = el.querySelector('.read-receipt');
                if (receiptEl) {
                    if (readerCount > 1) {
                        receiptEl.className = 'read-receipt read';
                        receiptEl.textContent = '✓✓';
                    } else if (readerCount === 1) {
                        receiptEl.className = 'read-receipt delivered';
                        receiptEl.textContent = '✓✓';
                    }
                }
            }
        });
    });

    clearAllChatBtn?.addEventListener('click', window.clearAllChatMessages);
    chatSendBtn?.addEventListener('click', sendChatMessage);
    chatInput?.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); } });
    
    const savedUsername = localStorage.getItem('vom_chat_username');
    if (savedUsername && chatUsername) chatUsername.value = savedUsername;
    chatUsername?.addEventListener('change', () => { 
        if(chatUsername.value.trim()) localStorage.setItem('vom_chat_username', chatUsername.value.trim());
        updateAdminButton();
    });
    updateAdminButton();
    
    setInterval(() => { if (!isLiveActive && chatPopup.classList.contains('active')) { chatPopup.classList.remove('active'); chatOverlay.classList.remove('active'); document.body.style.overflow = ''; } }, 1000);
</script>
